<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <!-- Fondo general -->
  <rect x="0" y="0" width="820" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Barra falsa de navegador -->
  <rect x="0" y="0" width="820" height="36" rx="14" fill="#e2e8f0" />
  <rect x="0" y="22" width="820" height="14" fill="#e2e8f0" />
  <circle cx="22" cy="18" r="5.5" fill="#f87171" />
  <circle cx="40" cy="18" r="5.5" fill="#fbbf24" />
  <circle cx="58" cy="18" r="5.5" fill="#4ade80" />
  <rect x="90" y="7" width="380" height="22" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="104" y="22" font-size="11.5" fill="#475569">localhost:4200/country/by-capital</text>

  <!-- 1. App (Shell global) -->
  <rect x="18" y="48" width="784" height="456" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" />
  <rect x="30" y="38" width="350" height="22" rx="5" fill="#334155" />
  <text x="40" y="53" font-size="11.5" font-weight="700" fill="#ffffff">App (Shell · Flexbox Sticky Footer)</text>

  <!-- 2. CountryLayout (dentro del <router-outlet /> principal) -->
  <rect x="36" y="74" width="748" height="316" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <rect x="48" y="64" width="445" height="22" rx="5" fill="#4f46e5" />
  <text x="58" y="79" font-size="11.5" font-weight="700" fill="#ffffff">CountryLayout (pintado en &lt;router-outlet /&gt; principal · /country/*)</text>

  <!-- 2A. TopMenu -->
  <rect x="54" y="98" width="712" height="52" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
  <text x="68" y="116" font-size="11" font-weight="700" fill="#047857">&lt;country-top-menu /&gt; · TopMenu</text>
  <rect x="68" y="123" width="110" height="20" rx="4" fill="#059669" />
  <text x="123" y="137" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Por Capital</text>
  <rect x="188" y="123" width="95" height="20" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1.2" />
  <text x="235" y="137" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">Por País</text>
  <rect x="293" y="123" width="105" height="20" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1.2" />
  <text x="345" y="137" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">Por Región</text>
  <text x="752" y="137" text-anchor="end" font-size="10.5" fill="#065f46">Fijo en todas las rutas hijas</text>

  <!-- 2B. Página hija activa (ByCapitalPage dentro del <router-outlet /> interno) -->
  <rect x="54" y="164" width="712" height="212" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
  <rect x="66" y="154" width="495" height="21" rx="5" fill="#d97706" />
  <text x="76" y="168" font-size="11" font-weight="700" fill="#ffffff">ByCapitalPage (pintado en &lt;router-outlet /&gt; interno · cambia según pestaña)</text>

  <!-- 2B-1. SearchInput -->
  <rect x="72" y="186" width="676" height="58" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text x="86" y="203" font-size="11" font-weight="700" fill="#0369a1">&lt;country-search-input /&gt; · SearchInput (input() + output())</text>
  <rect x="86" y="211" width="460" height="24" rx="5" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5" />
  <text x="98" y="227" font-size="11" fill="#94a3b8">Buscar por capital de mi país...</text>
  <rect x="556" y="211" width="90" height="24" rx="5" fill="#0284c7" />
  <text x="601" y="227" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Buscar</text>

  <!-- 2B-2. CountryList -->
  <rect x="72" y="256" width="676" height="108" rx="7" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2" />
  <text x="86" y="274" font-size="11" font-weight="700" fill="#6b21a8">&lt;country-list /&gt; · CountryList (Tabla DaisyUI reutilizable)</text>
  <!-- Cabecera tabla -->
  <rect x="86" y="282" width="648" height="22" rx="4" fill="#e9d5ff" />
  <text x="102" y="297" font-size="10.5" font-weight="700" fill="#581c87">#</text>
  <text x="145" y="297" font-size="10.5" font-weight="700" fill="#581c87">Icono</text>
  <text x="215" y="297" font-size="10.5" font-weight="700" fill="#581c87">Bandera</text>
  <text x="310" y="297" font-size="10.5" font-weight="700" fill="#581c87">Nombre</text>
  <text x="435" y="297" font-size="10.5" font-weight="700" fill="#581c87">Capital</text>
  <text x="545" y="297" font-size="10.5" font-weight="700" fill="#581c87">Población</text>
  <text x="645" y="297" font-size="10.5" font-weight="700" fill="#581c87">Acción</text>
  <!-- Fila 1 -->
  <rect x="86" y="307" width="648" height="22" rx="3" fill="#ffffff" />
  <text x="102" y="322" font-size="10.5" fill="#334155">1</text>
  <text x="145" y="322" font-size="10.5" fill="#334155">🇪🇸</text>
  <text x="215" y="322" font-size="10.5" fill="#64748b">[SVG]</text>
  <text x="310" y="322" font-size="10.5" fill="#334155">España</text>
  <text x="435" y="322" font-size="10.5" fill="#334155">Madrid</text>
  <text x="545" y="322" font-size="10.5" fill="#334155">47,351,567</text>
  <text x="645" y="322" font-size="10.5" font-weight="600" fill="#7e22ce">Más info →</text>
  <!-- Fila 2 -->
  <rect x="86" y="332" width="648" height="22" rx="3" fill="#faf5ff" />
  <text x="102" y="347" font-size="10.5" fill="#334155">2</text>
  <text x="145" y="347" font-size="10.5" fill="#334155">🇫🇷</text>
  <text x="215" y="347" font-size="10.5" fill="#64748b">[SVG]</text>
  <text x="310" y="347" font-size="10.5" fill="#334155">Francia</text>
  <text x="435" y="347" font-size="10.5" fill="#334155">París</text>
  <text x="545" y="347" font-size="10.5" fill="#334155">67,391,582</text>
  <text x="645" y="347" font-size="10.5" font-weight="600" fill="#7e22ce">Más info →</text>

  <!-- Espaciador Flexbox -->
  <line x1="36" y1="414" x2="784" y2="414" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4" />
  <rect x="275" y="403" width="270" height="22" rx="4" fill="#ffffff" />
  <text x="410" y="418" text-anchor="middle" font-size="11" fill="#64748b">&lt;div class="flex-1 flex-grow"&gt; (empuja el footer)</text>

  <!-- 3. Footer -->
  <rect x="36" y="438" width="748" height="52" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2" />
  <text x="52" y="458" font-size="11.5" font-weight="700" fill="#be123c">&lt;app-footer /&gt; · Footer (compartido en TODAS las rutas, incluida la Home '/')</text>
  <text x="52" y="477" font-size="10.5" fill="#9f1239">Siempre anclado en la parte inferior gracias a Flexbox (Sticky Footer) en App</text>
</svg>
