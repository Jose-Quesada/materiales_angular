<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="title desc" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <title id="title">Comparativa arquitectónica: [(ngModel)] frente a model()</title>
  <desc id="desc">Diagrama comparativo de dos filas: arriba, [(ngModel)] enlazando un componente TypeScript con un control HTML nativo de formulario; abajo, model() sincronizando de forma bidireccional un componente padre con un componente hijo personalizado mediante Signals.</desc>

  <defs>
    <marker id="arrow-blue-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-blue-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-purple-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-purple-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- Fondo general -->
  <rect x="0" y="0" width="840" height="320" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- FILA 1: [(ngModel)] -->
  <rect x="20" y="22" width="800" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <rect x="34" y="12" width="380" height="22" rx="6" fill="#2563eb" />
  <text x="46" y="27" font-size="12" font-weight="700" fill="#ffffff">1. Ámbito de [(ngModel)] — Formularios y DOM Nativo</text>

  <!-- Caja Izq 1 -->
  <rect x="38" y="48" width="225" height="86" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="150" y="75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Componente TS</text>
  <rect x="66" y="88" width="168" height="28" rx="5" fill="#dbeafe" />
  <text x="150" y="107" text-anchor="middle" font-size="12" font-family="Consolas, monospace" font-weight="600" fill="#1d4ed8">termino = ''</text>

  <!-- Flecha 1 -->
  <line x1="271" y1="91" x2="531" y2="91" stroke="#2563eb" stroke-width="2.5" marker-start="url(#arrow-blue-start)" marker-end="url(#arrow-blue-end)" />
  <rect x="314" y="64" width="174" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="401" y="86" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" font-weight="700" fill="#1d4ed8">[(ngModel)]</text>
  <text x="401" y="105" text-anchor="middle" font-size="11.5" fill="#475569">Requiere FormsModule</text>

  <!-- Caja Der 1 -->
  <rect x="540" y="48" width="262" height="86" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="671" y="72" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Control HTML Nativo</text>
  <text x="671" y="95" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#2563eb">&lt;input type="text"&gt;</text>
  <text x="671" y="116" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">Rastrea estados: dirty, touched, valid</text>

  <!-- FILA 2: model() -->
  <rect x="20" y="172" width="800" height="130" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" />
  <rect x="34" y="162" width="380" height="22" rx="6" fill="#7c3aed" />
  <text x="46" y="177" font-size="12" font-weight="700" fill="#ffffff">2. Ámbito de model() — Jerarquía de Componentes</text>

  <!-- Caja Izq 2 -->
  <rect x="38" y="198" width="225" height="86" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" />
  <text x="150" y="225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4c1d95">Componente Padre</text>
  <rect x="60" y="238" width="180" height="28" rx="5" fill="#ede9fe" />
  <text x="150" y="257" text-anchor="middle" font-size="12" font-family="Consolas, monospace" font-weight="600" fill="#6d28d9">total = signal(5)</text>

  <!-- Flecha 2 -->
  <line x1="271" y1="241" x2="531" y2="241" stroke="#7c3aed" stroke-width="2.5" marker-start="url(#arrow-purple-start)" marker-end="url(#arrow-purple-end)" />
  <rect x="306" y="214" width="190" height="52" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" />
  <text x="401" y="236" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" font-weight="700" fill="#6d28d9">[(cantidad)]</text>
  <text x="401" y="255" text-anchor="middle" font-size="11.5" fill="#475569">Reactividad con Signals</text>

  <!-- Caja Der 2 -->
  <rect x="540" y="198" width="262" height="86" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" />
  <text x="671" y="222" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4c1d95">Componente Hijo Custom</text>
  <text x="671" y="245" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#7c3aed">cantidad = model(0)</text>
  <text x="671" y="266" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">Sintetiza Input + Output implícito</text>
</svg>
