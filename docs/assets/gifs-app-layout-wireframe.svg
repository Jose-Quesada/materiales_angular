  <text x="56" y="234" font-size="10.5" font-weight="700" fill="#34d399">&lt;gifs-side-menu-options /&gt;</text>

  <rect x="56" y="248" width="180" height="44" rx="6" fill="#2563eb" />
  <text x="68" y="267" font-size="11.5" font-weight="700" fill="#ffffff">📈 Trending</text>
