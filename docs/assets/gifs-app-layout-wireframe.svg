<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" width="820" height="490" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <!-- Fondo general -->
  <rect x="0" y="0" width="820" height="490" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

