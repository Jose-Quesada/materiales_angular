<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-labelledby="title desc" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <title id="title">Anidamiento de componentes en GifsApp y comunicación reactiva vía GifService</title>
  <desc id="desc">Diagrama de cajas anidadas mostrando DashboardPageComponent conteniendo SideMenuComponent (con SideMenuHeaderComponent y SideMenuOptionsComponent dentro) y el RouterOutlet (con SearchPageComponent o GifHistoryComponent dentro), comunicados reactivamente mediante GifService.</desc>

  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Fondo general -->
  <rect x="0" y="0" width="860" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- 1. Contenedor Raíz de la Vista: DashboardPageComponent -->
  <rect x="20" y="28" width="820" height="320" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" stroke-dasharray="7,4" />
  <rect x="34" y="16" width="290" height="24" rx="6" fill="#334155" />
  <text x="48" y="32" font-size="12" font-weight="700" fill="#ffffff">DashboardPageComponent (Shell Contenedor)</text>

  <!-- 1A. Rama Izquierda Anidada: SideMenuComponent -->
  <rect x="38" y="54" width="286" height="278" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <text x="52" y="76" font-size="11.5" font-weight="700" fill="#38bdf8">SideMenuComponent (&lt;gifs-side-menu /&gt;)</text>

  <!-- Hijo 1 de SideMenu: Header -->
  <rect x="52" y="88" width="258" height="44" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
  <text x="66" y="108" font-size="11" font-weight="600" fill="#e2e8f0">SideMenuHeaderComponent</text>
  <text x="66" y="123" font-size="9.5" fill="#94a3b8">Logo y subtítulo de la app</text>

  <!-- Hijo 2 de SideMenu: SideMenuOptionsComponent -->
  <rect x="52" y="142" width="258" height="176" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="66" y="163" font-size="11" font-weight="700" fill="#34d399">SideMenuOptionsComponent</text>
  <text x="66" y="178" font-size="9.5" fill="#94a3b8">Navegación lateral + Historial reactivo</text>

  <rect x="66" y="188" width="230" height="26" rx="5" fill="#0f172a" />
  <text x="78" y="205" font-size="10.5" fill="#cbd5e1">• Trending  |  • Buscador</text>

  <rect x="66" y="222" width="230" height="82" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.4" />
  <text x="78" y="241" font-size="10" font-weight="700" fill="#6ee7b7">@for (key of searchHistoryKeys())</text>
  <text x="78" y="260" font-size="10.5" fill="#ecfdf5">🕒 goku   🕒 saitama   🕒 vegeta</text>
  <text x="78" y="280" font-size="9.5" font-family="Consolas, monospace" fill="#a7f3d0">gifService.searchHistoryKeys()</text>

  <!-- 1B. Rama Derecha Anidada: Router Outlet -->
  <rect x="344" y="54" width="478" height="278" rx="10" fill="#f1f5f9" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4" />
  <rect x="358" y="43" width="320" height="22" rx="5" fill="#0284c7" />
  <text x="370" y="58" font-size="11" font-weight="700" fill="#ffffff">Área de Contenido (&lt;router-outlet /&gt; · Vistas hijas)</text>
  <text x="360" y="82" font-size="10.5" fill="#475569">Renderiza dinámicamente la página activa según la ruta actual:</text>

  <!-- Vista Hija A: SearchPageComponent -->
  <rect x="360" y="94" width="224" height="224" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
  <text x="374" y="116" font-size="11.5" font-weight="700" fill="#b45309">SearchPageComponent</text>
  <text x="374" y="132" font-size="10" font-family="Consolas, monospace" fill="#92400e">/dashboard/search</text>

  <rect x="374" y="148" width="196" height="32" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5" />
  <text x="384" y="168" font-size="10.5" fill="#334155">🔍 [ goku ]  ↵ Enter</text>

  <rect x="374" y="192" width="196" height="54" rx="6" fill="#fef3c7" />
  <text x="472" y="213" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">onSearch(query)</text>
  <text x="472" y="231" text-anchor="middle" font-size="9.5" font-family="Consolas, monospace" fill="#b45309">gifService.searchGifs(query)</text>

  <!-- Subcomponente anidado GifList -->
  <rect x="374" y="256" width="196" height="48" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2" />
  <text x="472" y="277" text-anchor="middle" font-size="10" font-weight="700" fill="#6b21a8">&lt;gif-list [gifs]="gifs()" /&gt;</text>
  <text x="472" y="293" text-anchor="middle" font-size="9" fill="#7e22ce">&lt;gif-list-item /&gt; × N</text>

  <!-- Vista Hija B: GifHistoryComponent -->
  <rect x="598" y="94" width="208" height="224" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8" />
  <text x="612" y="116" font-size="11.5" font-weight="700" fill="#334155">GifHistoryComponent</text>
  <text x="612" y="132" font-size="10" font-family="Consolas, monospace" fill="#64748b">/dashboard/history/:query</text>

  <rect x="612" y="148" width="180" height="88" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="702" y="172" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">Vista de Historial</text>
  <text x="702" y="192" text-anchor="middle" font-size="9.5" fill="#64748b">Lee término de la URL y</text>
  <text x="702" y="207" text-anchor="middle" font-size="9.5" fill="#64748b">recupera GIFs desde caché</text>

  <rect x="612" y="256" width="180" height="48" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2" />
  <text x="702" y="277" text-anchor="middle" font-size="10" font-weight="700" fill="#6b21a8">&lt;gif-list [gifs]="..." /&gt;</text>
  <text x="702" y="293" text-anchor="middle" font-size="9" fill="#7e22ce">&lt;gif-list-item /&gt; × N</text>

  <!-- 2. Capa Transversal Fuera del DOM: GifService (Singleton) -->
  <rect x="20" y="400" width="820" height="102" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <rect x="560" y="388" width="264" height="24" rx="6" fill="#4f46e5" />
  <text x="692" y="404" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">GifService (@Service() · Singleton)</text>

  <!-- Paso 2 dentro de GifService -->
  <rect x="360" y="424" width="224" height="62" rx="8" fill="#ffffff" stroke="#818cf8" stroke-width="1.5" />
  <text x="472" y="446" text-anchor="middle" font-size="11" font-weight="700" fill="#3730a3">searchGifs(query)</text>
  <text x="472" y="464" text-anchor="middle" font-size="10" fill="#475569">Petición HTTP + tap() guarda caché</text>
  <text x="472" y="478" text-anchor="middle" font-size="9.5" font-family="Consolas, monospace" fill="#4f46e5">searchHistory.update(...)</text>

  <!-- Flecha interna Paso 2 -->
  <line x1="358" y1="455" x2="318" y2="455" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arrow-indigo)" />
  <rect x="322" y="421" width="34" height="20" rx="10" fill="#4f46e5" />
  <text x="339" y="435" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">2</text>

  <rect x="52" y="424" width="258" height="62" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.8" />
  <text x="181" y="446" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">2. Actualiza Signal y Computed</text>
  <text x="181" y="464" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#047857">searchHistoryKeys = computed(</text>
  <text x="181" y="478" text-anchor="middle" font-size="10" font-family="Consolas, monospace" fill="#047857">  () =&gt; Object.keys(searchHistory())</text>

  <!-- Flecha 1: SearchPageComponent -> GifService -->
  <line x1="472" y1="318" x2="472" y2="416" stroke="#d97706" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow-amber)" />
  <rect x="394" y="358" width="156" height="24" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" />
  <text x="472" y="374" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">1. Dispara búsqueda ↓</text>

  <!-- Flecha 3: GifService -> SideMenuOptionsComponent -->
  <line x1="181" y1="424" x2="181" y2="326" stroke="#059669" stroke-width="2.8" marker-end="url(#arrow-emerald)" />
  <rect x="64" y="358" width="234" height="24" rx="12" fill="#dcfce7" stroke="#10b981" stroke-width="1.2" />
  <text x="181" y="374" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">↑ 3. Notifica searchHistoryKeys()</text>
</svg>
