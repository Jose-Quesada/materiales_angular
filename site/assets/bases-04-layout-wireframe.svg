<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <!-- Fondo general -->
  <rect x="0" y="0" width="820" height="430" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Barra de navegador -->
  <rect x="0" y="0" width="820" height="36" rx="14" fill="#e2e8f0" />
  <rect x="0" y="22" width="820" height="14" fill="#e2e8f0" />
  <circle cx="22" cy="18" r="5.5" fill="#f87171" />
  <circle cx="40" cy="18" r="5.5" fill="#fbbf24" />
  <circle cx="58" cy="18" r="5.5" fill="#4ade80" />
  <rect x="90" y="7" width="320" height="22" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="104" y="22" font-size="11.5" fill="#475569">localhost:4200/  o  localhost:4200/hero</text>
  <text x="426" y="22" font-size="10.5" font-weight="600" fill="#475569">SPA: cambia la vista sin recargar el navegador</text>

  <!-- 1. index.html / AppComponent -->
  <rect x="18" y="48" width="784" height="366" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" />
  <rect x="30" y="38" width="420" height="22" rx="5" fill="#334155" />
  <text x="40" y="53" font-size="11.5" font-weight="700" fill="#ffffff">index.html (&lt;app-root /&gt;)  →  AppComponent (Contenedor Raíz)</text>

  <!-- 2. <router-outlet /> -->
  <rect x="36" y="74" width="748" height="322" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8" />
  <rect x="48" y="64" width="415" height="21" rx="5" fill="#475569" />
  <text x="58" y="78" font-size="11" font-weight="700" fill="#ffffff">&lt;router-outlet /&gt; · Pinta una página u otra según app.routes.ts</text>

  <!-- Vista A: CounterPageComponent (ruta '/') -->
  <rect x="54" y="100" width="342" height="278" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <rect x="66" y="90" width="245" height="21" rx="5" fill="#2563eb" />
  <text x="76" y="104" font-size="11" font-weight="700" fill="#ffffff">Ruta '/' → CounterPageComponent</text>

  <rect x="72" y="126" width="306" height="92" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="225" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Contador Tradicional: 10</text>
  <text x="225" y="176" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2563eb">Counter Signal: 10</text>
  <text x="225" y="200" text-anchor="middle" font-size="10.5" fill="#64748b">counterSignal = signal(10)</text>

  <rect x="72" y="234" width="94" height="34" rx="6" fill="#2563eb" />
  <text x="119" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">+1</text>
  <rect x="178" y="234" width="94" height="34" rx="6" fill="#3b82f6" />
  <text x="225" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">-1</text>
  <rect x="284" y="234" width="94" height="34" rx="6" fill="#64748b" />
  <text x="331" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Reset</text>

  <text x="225" y="302" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Eventos (click) → .update() / .set()</text>
  <text x="225" y="320" text-anchor="middle" font-size="10.5" fill="#475569">Separación HTML + CSS + TS (SoC)</text>
  <text x="225" y="352" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">Reactividad granular con Signals</text>

  <!-- Flecha bidireccional Router -->
  <text x="410" y="226" text-anchor="middle" font-size="18" font-weight="700" fill="#64748b">⇄</text>
  <text x="410" y="244" text-anchor="middle" font-size="9.5" font-weight="600" fill="#64748b">Router</text>

  <!-- Vista B: HeroPageComponent (ruta '/hero') -->
  <rect x="424" y="100" width="342" height="278" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
  <rect x="436" y="90" width="245" height="21" rx="5" fill="#059669" />
  <text x="446" y="104" font-size="11" font-weight="700" fill="#ffffff">Ruta '/hero' → HeroPageComponent</text>

  <rect x="442" y="126" width="306" height="122" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5" />
  <text x="456" y="149" font-size="11.5" font-weight="700" fill="#065f46">Nombre: <tspan font-weight="400" fill="#334155">Ironman (signal)</tspan></text>
  <text x="456" y="170" font-size="11.5" font-weight="700" fill="#065f46">Edad: <tspan font-weight="400" fill="#334155">45 (signal)</tspan></text>
  <text x="456" y="191" font-size="11.5" font-weight="700" fill="#047857">Descripción: <tspan font-weight="600" fill="#059669">Ironman - 45 (computed)</tspan></text>
  <text x="456" y="212" font-size="11.5" font-weight="700" fill="#047857">Capitalizado: <tspan font-weight="600" fill="#059669">IRONMAN (computed / pipe)</tspan></text>
  <text x="456" y="234" font-size="10" fill="#64748b">Se recalcula solo si cambian name() o age()</text>

  <rect x="442" y="262" width="146" height="32" rx="6" fill="#059669" />
  <text x="515" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Cambiar nombre</text>
  <rect x="602" y="262" width="146" height="32" rx="6" fill="#10b981" />
  <text x="675" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Cambiar edad</text>
  <rect x="442" y="304" width="306" height="30" rx="6" fill="#64748b" />
  <text x="595" y="323" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Reset</text>

  <text x="595" y="356" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">Signals derivadas con computed()</text>
</svg>
