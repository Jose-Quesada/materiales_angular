<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="title desc" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <title id="title">Flujo de Data Binding en Angular: Componente TypeScript y Plantilla HTML</title>
  <desc id="desc">Diagrama de los cuatro tipos de enlace de datos entre el componente TypeScript y su plantilla HTML: Interpolación, Property Binding, Event Binding y Two-Way Binding.</desc>

  <defs>
    <!-- Flechas -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-purple-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-purple-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- Fondo general -->
  <rect x="0" y="0" width="860" height="400" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Título -->
  <text x="430" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Flujo de Data Binding en Angular (Clase .ts ↔ Plantilla .html)</text>

  <!-- Panel Izquierdo: Componente (.ts) -->
  <rect x="24" y="52" width="252" height="324" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
  <rect x="38" y="42" width="224" height="24" rx="6" fill="#dc2626" />
  <text x="150" y="58" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Componente (Lógica TypeScript)</text>

  <!-- Bloque Estado Reactivo / Signals -->
  <rect x="42" y="84" width="216" height="172" rx="9" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
  <text x="150" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Estado Reactivo / Signals</text>
  <text x="150" y="136" text-anchor="middle" font-size="11" fill="#475569">Propiedades, signal(),</text>
  <text x="150" y="153" text-anchor="middle" font-size="11" fill="#475569">computed() y model()</text>
  <rect x="64" y="176" width="172" height="58" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" />
  <text x="150" y="196" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace" fill="#be123c">nombre = signal('Ana')</text>
  <text x="150" y="213" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace" fill="#be123c">activo = signal(true)</text>
  <text x="150" y="228" text-anchor="middle" font-size="10.5" font-family="Consolas, monospace" fill="#be123c">texto = model('')</text>

  <!-- Bloque Métodos y Handlers -->
  <rect x="42" y="274" width="216" height="84" rx="9" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
  <text x="150" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Métodos y Handlers</text>
  <text x="150" y="322" text-anchor="middle" font-size="11" fill="#475569">Funciones que reaccionan</text>
  <text x="150" y="339" text-anchor="middle" font-size="11" fill="#475569">a eventos del usuario</text>

  <!-- Panel Derecho: Plantilla (.html) -->
  <rect x="556" y="52" width="280" height="324" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <rect x="596" y="42" width="200" height="24" rx="6" fill="#2563eb" />
  <text x="696" y="58" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Plantilla (DOM HTML)</text>

  <!-- 1. Interpolación -->
  <rect x="574" y="78" width="244" height="58" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="696" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Texto y Nodos</text>
  <text x="696" y="121" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#2563eb">{{ expresion() }}</text>

  <!-- 2. Property Binding -->
  <rect x="574" y="148" width="244" height="58" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="696" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Propiedades del DOM</text>
  <text x="696" y="191" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#2563eb">[disabled]="!activo()"</text>

  <!-- 3. Two-Way Binding -->
  <rect x="574" y="218" width="244" height="58" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" />
  <text x="696" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Formularios Bidireccionales</text>
  <text x="696" y="261" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#7c3aed">[(ngModel)]="campo" · [(valor)]</text>

  <!-- 4. Event Binding -->
  <rect x="574" y="288" width="244" height="58" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" />
  <text x="696" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Eventos de Usuario</text>
  <text x="696" y="331" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#d97706">(click)="handler()"</text>

  <!-- Flecha 1: Interpolación (TS -> HTML) -->
  <line x1="262" y1="107" x2="566" y2="107" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)" />
  <rect x="336" y="92" width="156" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" />
  <text x="414" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">Interpolación  →</text>

  <!-- Flecha 2: Property Binding (TS -> HTML) -->
  <line x1="262" y1="177" x2="566" y2="177" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)" />
  <rect x="328" y="162" width="172" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" />
  <text x="414" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">Property Binding  →</text>

  <!-- Flecha 3: Two-Way Binding (TS <-> HTML) -->
  <line x1="268" y1="247" x2="566" y2="247" stroke="#7c3aed" stroke-width="2.4" marker-start="url(#arrow-purple-start)" marker-end="url(#arrow-purple-end)" />
  <rect x="324" y="232" width="180" height="24" rx="12" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1" />
  <text x="414" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">←  Two-Way Binding  →</text>

  <!-- Flecha 4: Event Binding (HTML -> TS) -->
  <line x1="570" y1="317" x2="266" y2="317" stroke="#d97706" stroke-width="2.4" marker-end="url(#arrow-amber)" />
  <rect x="334" y="302" width="160" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1" />
  <text x="414" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">←  Event Binding</text>
</svg>
