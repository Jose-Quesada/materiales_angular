  <!-- 2. Servicios conectados abajo -->
  <rect x="18" y="402" width="382" height="92" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <text x="34" y="424" font-size="11.5" font-weight="700" fill="#3730a3">GifService (Paginación y Matriz Masonry)</text>
  <text x="34" y="445" font-size="10.5" fill="#334155">• trendingGifs.update(prev =&gt; [...prev, ...gifs])</text>
  <text x="34" y="463" font-size="10.5" fill="#334155">• trendingPage + offset = page * 20 (bloqueo loading)</text>
  <text x="34" y="481" font-size="10.5" font-weight="600" fill="#4f46e5">• trendingGifGroup = computed&lt;Gif[][]&gt; (de 3 en 3)</text>

  <rect x="420" y="402" width="382" height="92" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2" />
  <text x="436" y="424" font-size="11.5" font-weight="700" fill="#be123c">ScrollStateService (shared/services/)</text>
  <text x="436" y="445" font-size="10.5" fill="#334155">• trendingScrollState = signal&lt;number&gt;(0)</text>
  <text x="436" y="463" font-size="10.5" fill="#334155">• Guarda scrollTop desde onScroll() vía viewChild</text>
  <text x="436" y="481" font-size="10.5" font-weight="600" fill="#be123c">• Restaura en ngAfterViewInit() / afterNextRender()</text>
</svg>
