  <text x="40" y="54" font-size="11.5" font-weight="700" fill="#ffffff">TrendingPageComponent · #groupDiv (h-screen overflow-y-scroll · (scroll)="onScroll()")</text>

  <!-- Etiqueta @for exterior -->
  <text x="34" y="78" font-size="11" font-weight="700" fill="#0369a1">grid-cols-2 md:grid-cols-4  →  @for (group of gifService.trendingGifGroup(); track $index)</text>

