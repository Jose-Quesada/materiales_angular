<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 245" width="740" height="245" style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">
  <!-- Fondo -->
  <rect x="0" y="0" width="740" height="245" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Marco CountryLayout -->
  <rect x="18" y="24" width="704" height="204" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" />
  <rect x="30" y="13" width="385" height="22" rx="5" fill="#4f46e5" />
  <text x="42" y="28" font-size="11.5" font-weight="700" fill="#ffffff">CountryLayout  →  ruta padre '' dentro de /country</text>

  <!-- Zona fija superior: TopMenu -->
  <rect x="36" y="48" width="668" height="48" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
  <text x="52" y="70" font-size="11.5" font-weight="700" fill="#047857">&lt;country-top-menu /&gt;</text>
  <rect x="200" y="59" width="88" height="24" rx="5" fill="#059669" />
  <text x="244" y="75" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">Por capital</text>
  <rect x="298" y="59" width="76" height="24" rx="5" fill="#ffffff" stroke="#10b981" stroke-width="1.2" />
  <text x="336" y="75" text-anchor="middle" font-size="10.5" font-weight="600" fill="#047857">Por país</text>
  <rect x="384" y="59" width="86" height="24" rx="5" fill="#ffffff" stroke="#10b981" stroke-width="1.2" />
  <text x="427" y="75" text-anchor="middle" font-size="10.5" font-weight="600" fill="#047857">Por región</text>
  <text x="690" y="76" text-anchor="end" font-size="10.5" font-weight="600" fill="#065f46">Fijo siempre arriba</text>

  <!-- Zona dinámica inferior: <section> + <router-outlet /> interno -->
  <rect x="36" y="110" width="668" height="102" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4" />
  <text x="52" y="131" font-size="11.5" font-weight="700" fill="#b45309">&lt;section class="px-4"&gt;  →  &lt;router-outlet /&gt; interno (children)</text>
  <text x="52" y="150" font-size="10.5" fill="#78350f">Aquí se inyecta dinámicamente la página hija activa según la URL:</text>

  <rect x="52" y="164" width="146" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
  <text x="125" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">by-capital</text>

  <rect x="214" y="164" width="146" height="34" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2" />
  <text x="287" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">by-country</text>

  <rect x="376" y="164" width="146" height="34" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2" />
  <text x="449" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">by-region</text>

  <rect x="538" y="164" width="150" height="34" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2" />
  <text x="613" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">by/:code</text>
</svg>
